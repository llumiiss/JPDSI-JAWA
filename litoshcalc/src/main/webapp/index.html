<!DOCTYPE html>
<html>
<head>
    <title>Kalkulator kredytowy</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <h1>Kalkulator kredytowy</h1>
    <form action="result" method="post">
        <label for="loanAmount">Kwota kredytu:</label><br>
        <input type="number" id="loanAmount" name="loanAmount" required><br>
        
        <label for="interestRate">Oprocentowanie:</label><br>
        <input type="number" step="0.01" id="interestRate" name="interestRate" required><br>

        <label for="loanTerm">Okres (w latach):</label><br>
        <input type="number" id="loanTerm" name="loanTerm" required><br>

        <input type="submit" value="Oblicz rate miesieczna">
    </form>
</body>
</html>
